<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cinnabar: #C44220;
      --bittersweet: #B8495F;
      --indigo: #6358B8;
      --magenta: #9A6AB0;
      --high-bg: #FBEAE5; --high-text: #C44220;
      --med-bg:  #FBEAED; --med-text:  #B8495F;
      --low-bg:  #F3EEFF; --low-text:  #9A6AB0;
      --cat-bg:  #EEEDFB; --cat-text:  #6358B8;
      --success: #2E7D32; --success-bg: #E8F5E9;
      --bg: #F5F4FA;
      --surface: #FFFFFF;
      --border: #E6E4F0;
      --text-primary: #1C1B2E;
      --text-secondary: #6B6880;
      --text-muted: #9D9AB0;
      --r-card: 16px; --r-btn: 999px; --r-input: 10px;
      --shadow: 0 1px 4px rgba(60,40,120,0.07);
      --shadow-hover: 0 4px 18px rgba(60,40,120,0.12);
      --transition: 180ms ease;
    }

    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

    .wrap { max-width: 680px; margin: 0 auto; padding: 36px 16px 80px; }

    /* ── Header ── */
    .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 26px; gap: 12px; }
    .app-name { font-size: 24px; font-weight: 700; color: var(--indigo); letter-spacing: -0.5px; }
    .app-tagline { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* ── Buttons ── */
    button { font-family: inherit; cursor: pointer; border: none; outline: none; transition: all var(--transition); }
    .btn { border-radius: var(--r-btn); font-size: 13px; font-weight: 600; padding: 8px 18px; display: inline-flex; align-items: center; gap: 6px; line-height: 1; }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-primary:hover { background: #5148A8; transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
    .btn-outline:hover { border-color: var(--indigo); color: var(--indigo); }
    .btn-danger { background: transparent; border: 1.5px solid #F5C4B0; color: var(--cinnabar); border-radius: var(--r-btn); font-size: 12px; font-weight: 600; padding: 5px 12px; }
    .btn-danger:hover { background: var(--high-bg); }
    .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border-radius: var(--r-btn); padding: 7px 14px; font-size: 13px; font-weight: 500; border: 1.5px solid var(--border); display: flex; align-items: center; gap: 6px; }
    .btn-ghost:hover { border-color: var(--indigo); color: var(--indigo); }
    .btn-sm { font-size: 12px; padding: 5px 12px; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: var(--r-btn); padding: 4px; border: 1px solid var(--border); margin-bottom: 18px; box-shadow: var(--shadow); }
    .tab { flex: 1; padding: 8px 10px; border-radius: var(--r-btn); font-size: 13px; font-weight: 600; color: var(--text-secondary); background: transparent; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all var(--transition); }
    .tab:hover:not(.active) { color: var(--indigo); }
    .tab.active { background: var(--indigo); color: #fff; box-shadow: 0 2px 10px rgba(99,88,184,0.28); }
    .tab-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; min-width: 20px; text-align: center; background: rgba(255,255,255,0.22); }
    .tab:not(.active) .tab-badge { background: var(--bg); color: var(--text-muted); }

    /* ── Add Panel ── */
    .add-panel { background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border); margin-bottom: 18px; overflow: hidden; box-shadow: var(--shadow); }
    .add-panel-trigger { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; user-select: none; }
    .add-panel-trigger:hover { background: var(--bg); }
    .add-panel-label { font-size: 14px; font-weight: 600; color: var(--indigo); display: flex; align-items: center; gap: 8px; }
    .add-panel-icon { font-size: 20px; color: var(--text-muted); line-height: 1; transition: transform 200ms ease; }
    .add-panel.open .add-panel-icon { transform: rotate(45deg); }
    .add-panel-body { display: none; padding: 16px 18px 18px; border-top: 1px solid var(--border); }
    .add-panel.open .add-panel-body { display: block; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.span2 { grid-column: 1 / -1; }
    label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; }

    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      font-family: inherit; font-size: 14px; color: var(--text-primary); background: var(--bg);
      border: 1.5px solid var(--border); border-radius: var(--r-input); padding: 9px 12px;
      width: 100%; outline: none; transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(99,88,184,0.1); background: var(--surface); }
    textarea { resize: vertical; min-height: 70px; }
    .err { font-size: 11px; color: var(--cinnabar); min-height: 14px; }

    .form-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }

    /* ── Controls (Active tab) ── */
    .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .sort-row { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-btn); overflow: hidden; flex: 1; min-width: 220px; }
    .sort-opt { flex: 1; padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--text-secondary); background: transparent; border-radius: 0; border-right: 1px solid var(--border); }
    .sort-opt:last-child { border-right: none; }
    .sort-opt.on { background: var(--indigo); color: #fff; }
    .sort-opt:hover:not(.on) { color: var(--indigo); background: var(--cat-bg); }
    .cat-sel { padding: 8px 12px; font-size: 13px; font-family: inherit; border: 1px solid var(--border); border-radius: var(--r-btn); background: var(--surface); color: var(--text-secondary); cursor: pointer; outline: none; }
    .cat-sel:focus { border-color: var(--indigo); }

    /* ── Section headers ── */
    .section-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-head:first-child { margin-top: 0; }
    .section-head.red { color: var(--cinnabar); }
    .s-count { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; padding: 1px 8px; }
    .section-head.red .s-count { background: var(--high-bg); border-color: #F5C4B0; color: var(--cinnabar); }

    /* ── Task cards ── */
    .task-list { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--border);
      padding: 16px; box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition), opacity 380ms ease, max-height 380ms ease, padding 380ms ease, margin 380ms ease;
      max-height: 600px; overflow: hidden;
      animation: fadeUp 200ms ease both;
    }
    .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .card.overdue { border-left: 3px solid var(--cinnabar); }
    .card.done-card { opacity: 0.82; }
    .card.done-card .task-name { text-decoration: line-through; color: var(--text-muted); }
    .card.fading { opacity: 0; transform: translateY(-6px) scale(0.98); max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.2px; }
    .b-high { background: var(--high-bg); color: var(--high-text); }
    .b-med  { background: var(--med-bg);  color: var(--med-text);  }
    .b-low  { background: var(--low-bg);  color: var(--low-text);  }
    .b-cat  { background: var(--cat-bg);  color: var(--cat-text);  }

    .task-name { font-size: 15px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; }
    .task-notes { font-size: 13px; color: var(--text-muted); line-height: 1.55; margin-bottom: 6px; }
    .task-notes.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .notes-btn { font-size: 12px; color: var(--indigo); background: none; border: none; padding: 0; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
    .notes-btn:hover { text-decoration: underline; }

    .meta { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; margin-top: 8px; }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .meta-item.alert { color: var(--cinnabar); font-weight: 600; }

    .card-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }

    .btn-done { border-radius: var(--r-btn); font-size: 13px; font-weight: 700; padding: 7px 18px; background: transparent; border: 1.5px solid var(--indigo); color: var(--indigo); display: flex; align-items: center; gap: 6px; transition: all var(--transition); }
    .btn-done:hover { background: var(--cat-bg); }
    .btn-done.success { background: var(--success); border-color: var(--success); color: #fff; animation: pop 300ms ease; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

    /* ── Empty states ── */
    .empty { text-align: center; padding: 52px 24px; color: var(--text-muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; }

    /* ── Completed controls ── */
    .done-bar { display: flex; justify-content: flex-end; margin-bottom: 14px; }

    /* ── Category modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(20,16,40,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .overlay.hidden { display: none; }
    .modal { background: var(--surface); border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); color: var(--text-muted); font-size: 19px; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .modal-close:hover { background: var(--border); color: var(--text-primary); }
    .cat-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; margin-bottom: 16px; }
    .cat-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 10px; padding: 9px 12px; }
    .cat-row-name { font-size: 14px; font-weight: 600; }
    .cat-row-meta { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
    .add-cat { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 14px; }
    .add-cat input { flex: 1; }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.span2 { grid-column: 1; }
      .controls { flex-direction: column; align-items: stretch; }
      .sort-row { min-width: 0; }
      .cat-sel { width: 100%; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <header class="header">
    <div>
      <div class="app-name">TaskFlow</div>
      <div class="app-tagline">Get through your day, one task at a time.</div>
    </div>
    <button class="btn-ghost" id="openCat">⚙ Categories</button>
  </header>

  <!-- Tabs -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="today" role="tab">Today <span class="tab-badge" id="b-today">0</span></button>
    <button class="tab" data-tab="active" role="tab">Active <span class="tab-badge" id="b-active">0</span></button>
    <button class="tab" data-tab="done" role="tab">Completed <span class="tab-badge" id="b-done">0</span></button>
  </nav>

  <!-- Add task panel -->
  <div class="add-panel" id="addPanel">
    <div class="add-panel-trigger" id="addTrigger">
      <span class="add-panel-label">+ Add new task</span>
      <span class="add-panel-icon">+</span>
    </div>
    <div class="add-panel-body">
      <div class="form-grid">
        <div class="form-group span2">
          <label for="fName">Task name *</label>
          <input type="text" id="fName" placeholder="What needs to be done?">
          <div class="err" id="eN"></div>
        </div>
        <div class="form-group span2">
          <label for="fNotes">Notes (optional)</label>
          <textarea id="fNotes" rows="3" placeholder="Any extra context or sub-notes…"></textarea>
        </div>
        <div class="form-group">
          <label for="fTime">Time needed (min) *</label>
          <input type="number" id="fTime" placeholder="e.g. 30" min="1">
          <div class="err" id="eT"></div>
        </div>
        <div class="form-group">
          <label for="fPriority">Priority *</label>
          <select id="fPriority">
            <option value="">Select priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
          <div class="err" id="eP"></div>
        </div>
        <div class="form-group">
          <label for="fDeadline">Deadline *</label>
          <input type="date" id="fDeadline">
          <div class="err" id="eD"></div>
        </div>
        <div class="form-group">
          <label for="fCat">Category</label>
          <select id="fCat"><option value="">No category</option></select>
        </div>
      </div>
      <div class="form-footer">
        <button class="btn btn-outline" id="cancelAdd">Cancel</button>
        <button class="btn btn-primary" id="submitAdd">Add Task</button>
      </div>
    </div>
  </div>

  <!-- Tab contents -->
  <div id="pane-today"></div>
  <div id="pane-active" style="display:none"></div>
  <div id="pane-done" style="display:none"></div>

</div>

<!-- Category modal -->
<div class="overlay hidden" id="catOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Manage Categories</div>
      <button class="modal-close" id="closeCat">×</button>
    </div>
    <div class="cat-list" id="catList"></div>
    <div class="add-cat">
      <input type="text" id="newCatInput" placeholder="New category name…" maxlength="30">
      <button class="btn btn-primary btn-sm" id="addCatBtn">Add</button>
    </div>
    <div class="err" id="eCat" style="margin-top:6px"></div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let tasks = [];
  let categories = [];
  let currentTab = 'today';
  let sortBy = 'deadline';
  let filterCat = '';

  // ── Storage ────────────────────────────────────────────────────────────────
  const saveTasks = () => localStorage.setItem('taskManager_tasks', JSON.stringify(tasks));
  const saveCats  = () => localStorage.setItem('taskManager_categories', JSON.stringify(categories));

  function loadData() {
    const t = localStorage.getItem('taskManager_tasks');
    const c = localStorage.getItem('taskManager_categories');
    tasks = t ? JSON.parse(t) : [];
    if (c) {
      categories = JSON.parse(c);
    } else {
      categories = ['Hiring', 'Projects'];
      saveCats();
    }
  }

  // ── Date helpers ────────────────────────────────────────────────────────────
  const todayStr = () => new Date().toISOString().slice(0, 10);
  const isToday   = d => d === todayStr();
  const isOverdue = d => d < todayStr();

  function fmtDeadline(d) {
    const [y, m, day] = d.split('-').map(Number);
    const opts = { month: 'short', day: 'numeric' };
    if (y !== new Date().getFullYear()) opts.year = 'numeric';
    return new Date(y, m - 1, day).toLocaleDateString('en-US', opts);
  }

  function fmtDuration(mins) {
    if (mins < 60) return `${mins} min`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m === 0 ? `${h} h` : `${h} h ${m} min`;
  }

  function fmtCompletedAt(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
      ' at ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  // ── Sort ────────────────────────────────────────────────────────────────────
  const PRIO = { High: 3, Medium: 2, Low: 1 };
  function sortTasks(list, by) {
    return [...list].sort((a, b) => {
      if (by === 'deadline') return a.deadline.localeCompare(b.deadline);
      if (by === 'priority') return PRIO[b.priority] - PRIO[a.priority];
      if (by === 'time')     return a.timeNeeded - b.timeNeeded;
      return 0;
    });
  }

  // ── Task operations ─────────────────────────────────────────────────────────
  function addTask(data) {
    tasks.push({ id: crypto.randomUUID(), ...data, createdAt: new Date().toISOString(), completedAt: null, done: false });
    saveTasks();
    renderAll();
  }

  function completeTask(id) {
    const card = document.querySelector(`[data-id="${id}"]`);
    if (!card) return;
    const btn = card.querySelector('.btn-done');
    btn.classList.add('success');
    btn.innerHTML = '✓ &nbsp;Done!';
    btn.disabled = true;
    setTimeout(() => {
      card.classList.add('fading');
      setTimeout(() => {
        const t = tasks.find(t => t.id === id);
        if (t) { t.done = true; t.completedAt = new Date().toISOString(); }
        saveTasks();
        renderAll();
      }, 400);
    }, 650);
  }

  function deleteTask(id) {
    if (!confirm('Permanently delete this task?')) return;
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderAll();
  }

  function clearCompleted() {
    if (!confirm('Delete all completed tasks? This cannot be undone.')) return;
    tasks = tasks.filter(t => !t.done);
    saveTasks();
    renderAll();
  }

  // ── Category operations ─────────────────────────────────────────────────────
  function addCategory(name) {
    const n = name.trim();
    const errEl = document.getElementById('eCat');
    if (!n) { errEl.textContent = 'Please enter a name.'; return; }
    if (categories.map(c => c.toLowerCase()).includes(n.toLowerCase())) { errEl.textContent = 'Category already exists.'; return; }
    errEl.textContent = '';
    categories.push(n);
    saveCats();
    document.getElementById('newCatInput').value = '';
    renderCatModal();
    renderCatOptions();
  }

  function deleteCategory(name) {
    const inUse = tasks.filter(t => !t.done).some(t => t.category === name);
    if (inUse) { alert(`"${name}" is used by active tasks. Complete or reassign them first.`); return; }
    if (!confirm(`Delete category "${name}"?`)) return;
    categories = categories.filter(c => c !== name);
    saveCats();
    renderCatModal();
    renderCatOptions();
    if (filterCat === name) { filterCat = ''; }
    renderActiveTab();
  }

  // ── HTML helpers ────────────────────────────────────────────────────────────
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function prioBadge(p) {
    const cls = p === 'High' ? 'b-high' : p === 'Medium' ? 'b-med' : 'b-low';
    return `<span class="badge ${cls}">${p}</span>`;
  }

  function catBadge(c) {
    return c ? `<span class="badge b-cat">${esc(c)}</span>` : '';
  }

  function deadlineMeta(d, isDone) {
    const over = !isDone && isOverdue(d);
    return `<span class="meta-item ${over ? 'alert' : ''}">${over ? '⚠' : '📅'} ${fmtDeadline(d)}</span>`;
  }

  function cardHtml(task, showDelete = false) {
    const over = !task.done && isOverdue(task.deadline);
    const hasNotes = task.notes && task.notes.trim();
    return `
      <div class="card ${over ? 'overdue' : ''} ${task.done ? 'done-card' : ''}" data-id="${task.id}">
        <div class="badges">${prioBadge(task.priority)}${catBadge(task.category)}</div>
        <div class="task-name">${esc(task.name)}</div>
        ${hasNotes ? `
          <div class="task-notes clamp" id="notes-${task.id}">${esc(task.notes)}</div>
          <button class="notes-btn" data-notes="${task.id}">Show more</button>
        ` : ''}
        <div class="meta">
          ${deadlineMeta(task.deadline, task.done)}
          <span class="meta-item">⏱ ${fmtDuration(task.timeNeeded)}</span>
          ${task.done && task.completedAt ? `<span class="meta-item">✓ ${fmtCompletedAt(task.completedAt)}</span>` : ''}
        </div>
        <div class="card-foot">
          ${showDelete
            ? `<button class="btn-danger" onclick="deleteTask('${task.id}')">Delete</button>`
            : `<button class="btn-done" onclick="completeTask('${task.id}')">Mark done</button>`
          }
        </div>
      </div>`;
  }

  // ── Render tabs ─────────────────────────────────────────────────────────────
  function renderTodayTab() {
    const today = todayStr();
    const overdue = sortTasks(tasks.filter(t => !t.done && t.deadline < today), 'deadline');
    const due     = sortTasks(tasks.filter(t => !t.done && t.deadline === today), 'priority');
    const el = document.getElementById('pane-today');

    if (!overdue.length && !due.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">🎉</div><div class="empty-title">You're all caught up!</div><div class="empty-sub">Nothing overdue or due today. Nice work.</div></div>`;
      return;
    }
    let html = '';
    if (overdue.length) {
      html += `<div class="section-head red">Overdue <span class="s-count">${overdue.length}</span></div>`;
      html += `<div class="task-list">${overdue.map(t => cardHtml(t)).join('')}</div>`;
    }
    if (due.length) {
      html += `<div class="section-head">Due today <span class="s-count">${due.length}</span></div>`;
      html += `<div class="task-list">${due.map(t => cardHtml(t)).join('')}</div>`;
    }
    el.innerHTML = html;
    bindNotesButtons(el);
  }

  function renderActiveTab() {
    const el = document.getElementById('pane-active');
    let active = tasks.filter(t => !t.done);
    if (filterCat) active = active.filter(t => t.category === filterCat);
    const sorted = sortTasks(active, sortBy);

    const catOptions = categories.map(c => `<option value="${esc(c)}" ${filterCat===c?'selected':''}>${esc(c)}</option>`).join('');

    let html = `
      <div class="controls">
        <div class="sort-row">
          <button class="sort-opt ${sortBy==='deadline'?'on':''}" onclick="setSort('deadline')">By Deadline</button>
          <button class="sort-opt ${sortBy==='priority'?'on':''}" onclick="setSort('priority')">By Priority</button>
          <button class="sort-opt ${sortBy==='time'?'on':''}" onclick="setSort('time')">By Time</button>
        </div>
        <select class="cat-sel" onchange="setFilter(this.value)">
          <option value="">All categories</option>
          ${catOptions}
        </select>
      </div>`;

    if (!sorted.length) {
      html += `<div class="empty"><div class="empty-icon">✨</div><div class="empty-title">No tasks here</div><div class="empty-sub">${filterCat ? 'No active tasks in this category.' : 'Add your first task above to get started.'}</div></div>`;
    } else {
      html += `<div class="task-list">${sorted.map(t => cardHtml(t)).join('')}</div>`;
    }
    el.innerHTML = html;
    bindNotesButtons(el);
  }

  function renderCompletedTab() {
    const el = document.getElementById('pane-done');
    const done = [...tasks.filter(t => t.done)].sort((a, b) => b.completedAt.localeCompare(a.completedAt));
    if (!done.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No completed tasks yet</div><div class="empty-sub">Completed tasks will appear here.</div></div>`;
      return;
    }
    let html = `<div class="done-bar"><button class="btn btn-outline btn-sm" onclick="clearCompleted()">Clear all completed</button></div>`;
    html += `<div class="task-list">${done.map(t => cardHtml(t, true)).join('')}</div>`;
    el.innerHTML = html;
    bindNotesButtons(el);
  }

  function updateBadges() {
    const today = todayStr();
    document.getElementById('b-today').textContent  = tasks.filter(t => !t.done && (t.deadline <= today)).length;
    document.getElementById('b-active').textContent  = tasks.filter(t => !t.done).length;
    document.getElementById('b-done').textContent    = tasks.filter(t =>  t.done).length;
  }

  function renderAll() {
    updateBadges();
    renderTodayTab();
    renderActiveTab();
    renderCompletedTab();
  }

  // ── Notes toggle ─────────────────────────────────────────────────────────────
  function bindNotesButtons(container) {
    container.querySelectorAll('.notes-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.notes;
        const p = document.getElementById(`notes-${id}`);
        if (!p) return;
        const clamped = p.classList.toggle('clamp');
        btn.textContent = clamped ? 'Show more' : 'Show less';
      });
    });
  }

  // ── Category rendering ──────────────────────────────────────────────────────
  function renderCatModal() {
    const el = document.getElementById('catList');
    if (!categories.length) {
      el.innerHTML = `<div style="font-size:13px;color:var(--text-muted);padding:4px 0">No categories yet.</div>`;
      return;
    }
    el.innerHTML = categories.map(c => {
      const inUse = tasks.filter(t => !t.done).some(t => t.category === c);
      return `<div class="cat-row">
        <div><span class="cat-row-name">${esc(c)}</span>${inUse ? `<span class="cat-row-meta">(in use)</span>` : ''}</div>
        <button class="btn-danger btn-sm" ${inUse ? 'disabled title="Used by active tasks"' : ''} onclick="deleteCategory('${esc(c)}')" >Delete</button>
      </div>`;
    }).join('');
  }

  function renderCatOptions() {
    const sel = document.getElementById('fCat');
    sel.innerHTML = `<option value="">No category</option>` +
      categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }

  // ── Tab switching ────────────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    ['today','active','done'].forEach(id => {
      document.getElementById(`pane-${id}`).style.display = id === tab ? '' : 'none';
    });
  }

  function setSort(s) { sortBy = s; renderActiveTab(); }
  function setFilter(v) { filterCat = v; renderActiveTab(); }

  // ── Form validation & submit ─────────────────────────────────────────────────
  function clearErrors() {
    ['eN','eT','eP','eD'].forEach(id => document.getElementById(id).textContent = '');
  }

  function submitTask() {
    clearErrors();
    const name     = document.getElementById('fName').value.trim();
    const notes    = document.getElementById('fNotes').value.trim();
    const time     = parseInt(document.getElementById('fTime').value);
    const priority = document.getElementById('fPriority').value;
    const deadline = document.getElementById('fDeadline').value;
    const category = document.getElementById('fCat').value || null;

    let ok = true;
    if (!name)            { document.getElementById('eN').textContent = 'Task name is required.'; ok = false; }
    if (!time || time < 1){ document.getElementById('eT').textContent = 'Enter a valid duration.'; ok = false; }
    if (!priority)         { document.getElementById('eP').textContent = 'Select a priority level.'; ok = false; }
    if (!deadline)         { document.getElementById('eD').textContent = 'Deadline is required.'; ok = false; }
    if (!ok) return;

    addTask({ name, notes, timeNeeded: time, priority, deadline, category });
    ['fName','fNotes','fTime','fDeadline'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fPriority').value = '';
    document.getElementById('fCat').value = '';
    document.getElementById('addPanel').classList.remove('open');
    clearErrors();
  }

  // ── Event listeners ─────────────────────────────────────────────────────────
  document.getElementById('addTrigger').addEventListener('click', () => {
    document.getElementById('addPanel').classList.toggle('open');
  });
  document.getElementById('cancelAdd').addEventListener('click', () => {
    document.getElementById('addPanel').classList.remove('open');
    clearErrors();
  });
  document.getElementById('submitAdd').addEventListener('click', submitTask);
  document.getElementById('fName').addEventListener('keydown', e => { if (e.key === 'Enter') submitTask(); });

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  document.getElementById('openCat').addEventListener('click', () => {
    renderCatModal();
    document.getElementById('catOverlay').classList.remove('hidden');
  });
  document.getElementById('closeCat').addEventListener('click', () => {
    document.getElementById('catOverlay').classList.add('hidden');
  });
  document.getElementById('catOverlay').addEventListener('click', e => {
    if (e.target.id === 'catOverlay') document.getElementById('catOverlay').classList.add('hidden');
  });
  document.getElementById('addCatBtn').addEventListener('click', () => {
    addCategory(document.getElementById('newCatInput').value);
  });
  document.getElementById('newCatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCategory(e.target.value);
  });

  // ── Init ────────────────────────────────────────────────────────────────────
  loadData();
  renderCatOptions();
  renderAll();
</script>
</body>
</html>
